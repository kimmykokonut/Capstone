name: Keep Supabase Active

on:
  schedule:
    # Runs every day at 9am UTC
    - cron: "0 9 * * *"
  workflow_dispatch: # allows manual trigger from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Supabase active (health check with DB query)
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" https://myco-matrix.onrender.com/health-check

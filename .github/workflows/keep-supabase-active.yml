name: Keep Supabase Active

on:
  schedule:
    # Runs every 6 days at 9am UTC
    - cron: "0 9 */6 * *"
  workflow_dispatch: # allows manual trigger from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend endpoint (queries DB via trip list)
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" https://myco-matrix.onrender.com/trips